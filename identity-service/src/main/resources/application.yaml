

spring:
  application:
    name: identity-service
  profiles:
    active: ${SPRING_PROFILE_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: validate


  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/private.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:15m}
  issuer: ${JWT_ISSUER:shop-platform-identity}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:7d}


server:
  port: 8280